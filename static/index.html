<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static2App Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.6;
    }
    h1 { color: #2563eb; }
    .info { 
      background: #f0f9ff; 
      padding: 15px; 
      border-radius: 8px; 
      border-left: 4px solid #2563eb;
    }
  </style>
</head>
<body>
  <h1>🚀 Hello, Static2App!</h1>
  <div class="info">
    <p><strong>This is a demo page.</strong></p>
    <p>Replace the contents of the <code>static/</code> directory with your actual web application.</p>
    <p>Your static files will be embedded into a single executable binary.</p>
  </div>
  <p>✅ Server is running locally on your machine</p>
  <p>🔒 No data leaves your computer</p>
  <p><a href="/home.html">Visit Home Page</a></p>
</body>
</html>
