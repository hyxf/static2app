name: Release Static2App Action

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Validate Rust build and update major tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Action manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f action/action.yml
          echo "action/action.yml exists"

      - name: Build Rust executable
        run: cargo build --release --locked

      - name: Update v1 major tag
        if: startsWith(github.ref_name, 'v1.')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag --force v1 "$GITHUB_SHA"
          git push origin refs/tags/v1 --force
