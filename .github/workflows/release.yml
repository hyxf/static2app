name: Release Static2App Action

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate action metadata and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Action metadata
        uses: mpalmer/action-validator@v0.9.0
        with:
          version: 0.9.0
          patterns: action/action.yml

      - name: Build Rust executable
        run: cargo build --release --locked

  update-major-tag:
    name: Update v1 major tag
    needs: validate
    if: startsWith(github.ref_name, 'v1.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update v1 major tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag --force v1 "$GITHUB_SHA"
          git push origin refs/tags/v1 --force
