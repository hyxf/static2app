name: static2app packer
description: Package pre-built static web assets into a Rust binary with an embedded web UI
author: hyxf

branding:
  icon: package
  color: blue

inputs:
  dist-dir:
    description: Directory containing pre-built static assets (must contain index.html)
    required: true
  binary-name:
    description: Base name of the output binary (without extension)
    required: true
  version:
    description: Version string to embed into artifact name (overrides git tag)
    required: false

outputs:
  dist-dir:
    description: Directory containing packaged artifact and checksums
    value: ${{ steps.package.outputs.dist-dir }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        DIST_DIR: ${{ inputs.dist-dir }}
      run: |
        set -euo pipefail
        test -d "$DIST_DIR" || { echo "dist directory not found: $DIST_DIR" >&2; exit 1; }
        test -f "$DIST_DIR/index.html" || { echo "index.html not found in $DIST_DIR" >&2; exit 1; }

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Checkout static2app source
      uses: actions/checkout@v4
      with:
        repository: hyxf/static2app
        path: static2app-src
        ref: v1

    - name: Prepare static assets
      shell: bash
      env:
        DIST_DIR: ${{ inputs.dist-dir }}
      run: |
        set -euo pipefail
        target="static2app-src/static"
        rm -rf "$target"
        mkdir -p "$target"
        cp -R "$DIST_DIR"/. "$target"/

    - name: Build and package
      id: package
      shell: bash
      env:
        BINARY_NAME: ${{ inputs.binary-name }}
        INPUT_VERSION: ${{ inputs.version }}
        REF_NAME: ${{ github.ref_name }}
      working-directory: static2app-src
      run: |
        set -euo pipefail
        version="$INPUT_VERSION"
        if [ -z "$version" ]; then
          version="${REF_NAME#v}"
          [ -n "$version" ] || version="dev"
        fi
        target="$(rustc -vV | sed -n 's/^host: //p')"
        STATIC2APP_VERSION="$version" cargo build --release
        mkdir -p dist/pkg
        suffix=""
        case "$target" in
          *windows*) suffix=".exe" ;;
        esac
        artifact="${BINARY_NAME}-${version}-${target}"
        cp "target/release/static2app${suffix}" "dist/pkg/${artifact}${suffix}"
        if [[ "$target" == *windows* ]]; then
          (cd dist/pkg && 7z a -bd "${artifact}.zip" "${artifact}${suffix}" >/dev/null && rm "${artifact}${suffix}")
        else
          (cd dist/pkg && tar -czf "${artifact}.tar.gz" "${artifact}" && rm "${artifact}")
        fi
        if [[ "$target" == *apple* ]]; then
          (cd dist/pkg && shasum -a 256 * > checksums.txt)
        else
          (cd dist/pkg && sha256sum * > checksums.txt)
        fi
        echo "dist-dir=static2app-src/dist/pkg" >> "$GITHUB_OUTPUT"
