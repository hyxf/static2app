name: Package with Static2App
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  publish:
    # Use a native runner for each platform you want to publish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run build

      - name: Package with Static2App
        id: package
        uses: hyxf/static2app/action@v1
        with:
          dist-dir: dist
          binary-name: svg-editor
          # version: 1.0.0  # Optional: override git tag

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.package.outputs.dist-dir }}/*
          draft: false
          prerelease: false
          generate_release_notes: true
